name: chameleon_cli
description: "Material 3 Android control app for the Chameleon Ultra RFID/NFC device."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  flutter_blue_plus: ^1.34.5
  file_picker: ^13.3.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#00624E"
  adaptive_icon_foreground: "assets/icon_foreground.png"
